# values.yaml for oci://public.ecr.aws/aws-containers/retail-store-sample-chart:0.8.5
# Schema verified directly against each subchart's values.yaml + deployment
# templates - see infrastructure-debugging notes. Do not rename these keys;
# unknown keys are silently ignored by Helm, which is what broke the
# previous version of this file.

# ── UI ────────────────────────────────────────────────────────────────────────
ui:
  replicaCount: 2
  service:
    type: ClusterIP # ALB Ingress handles external exposure
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

# ── Catalog Service -> RDS MySQL ───────────────────────────────────────────────
catalog:
  replicaCount: 1
  mysql:
    create: false # disable the in-cluster MySQL StatefulSet
    endpoint: "bedrock-catalog-mysql.c0z6wuei25lr.us-east-1.rds.amazonaws.com" # plain hostname, no port suffix
    database: catalog
    secret:
      create: false # use the existing Secret below instead of generating one
      name: retail-store-catalog-db # matches the Secret your deploy workflow creates
      username: catalog_admin
      # password is read from the Secret's "password" key at runtime - not set here
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

# ── Orders Service -> RDS PostgreSQL ──────────────────────────────────────────
orders:
  replicaCount: 1
  postgresql:
    create: false # disable the in-cluster PostgreSQL StatefulSet
    database: orders
    endpoint:
      host: "bedrock-orders-postgres.c0z6wuei25lr.us-east-1.rds.amazonaws.com"
      port: "5432"
    secret:
      create: false
      name: retail-store-orders-db # matches the Secret your deploy workflow creates
      username: orders_admin
  rabbitmq:
    create: true # stays in-cluster - allowed per project brief
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

# ── Carts Service -> DynamoDB ──────────────────────────────────────────────────
carts:
  replicaCount: 1
  persistence: dynamodb
  dynamodb:
    create: false # disable the in-cluster DynamoDB-local emulator
    tableName: bedrock-carts # your ACTUAL table name (not project-bedrock-carts)
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::232428703462:role/bedrock-carts-dynamodb-role"
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

# ── Checkout ──────────────────────────────────────────────────────────────────
checkout:
  replicaCount: 1
  redis:
    create: true # stays in-cluster - lightweight cache, allowed per project brief
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

# ── Assets (static files) ─────────────────────────────────────────────────────
assets:
  replicaCount: 1