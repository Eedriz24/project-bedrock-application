# values.yaml for oci://public.ecr.aws/aws-containers/retail-store-sample-chart:0.8.5
# Schema verified directly against each subchart's values.yaml + deployment
# templates. Do not rename these keys - unknown keys are silently ignored
# by Helm, which is what broke every earlier version of this file.

ui:
  replicaCount: 2
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi
  endpoints:
    catalog: http://retail-store-catalog:80
    carts: http://retail-store-carts:80
    checkout: http://retail-store-checkout:80
    orders: http://retail-store-orders:80
    assets: http://retail-store-assets:80

catalog:
  replicaCount: 1
  mysql:
    create: false
    endpoint: "bedrock-catalog-mysql.c0z6wuei25lr.us-east-1.rds.amazonaws.com"
    database: catalog
    secret:
      create: false
      name: retail-store-catalog-db
      username: catalog_admin
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

orders:
  replicaCount: 1
  postgresql:
    create: false
    database: orders
    endpoint:
      host: "bedrock-orders-postgres.c0z6wuei25lr.us-east-1.rds.amazonaws.com"
      port: "5432"
    secret:
      create: false
      name: retail-store-orders-db
      username: orders_admin
  rabbitmq:
    create: true
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

carts:
  replicaCount: 1
  persistence: dynamodb
  dynamodb:
    create: false
    tableName: bedrock-carts
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::232428703462:role/bedrock-carts-dynamodb-role"
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

checkout:
  replicaCount: 1
  redis:
    create: true
  resources:
    requests:
      cpu: 128m
      memory: 256Mi
    limits:
      cpu: 512m
      memory: 512Mi

assets:
  replicaCount: 1
