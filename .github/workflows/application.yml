name: Application CI/CD

# Pull Request -> validate-manifests + validate-helm + validate-lambda
#                 (lints everything before it can reach main)
# Push/merge to main -> deploy (Helm upgrade/install against the live
#                 EKS cluster provisioned by the infrastructure layer)
# Manual trigger -> re-deploy on demand via workflow_dispatch

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
    paths:
      - "**"
  workflow_dispatch: {}

# Prevent two deploys racing each other against the same cluster.
concurrency:
  group: application-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: project-bedrock-cluster
  NAMESPACE: retail-app

jobs:
  # ============================================================
  # VALIDATE - raw Kubernetes manifests (PR only)
  # ============================================================
  validate-manifests:
    name: Validate Manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Validate raw manifests
        run: |
          kubeconform -strict -summary \
            -ignore-missing-schemas \
            application/kubernetes/namespace.yaml application/kubernetes/ingress.yaml \
            application/kubernetes/network-policies/*.yaml

  # ============================================================
  # VALIDATE - Helm chart + custom values (PR only)
  # ============================================================
  validate-helm:
    name: Validate Helm Chart
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: application/helm/retail-store
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Add upstream chart repo
        run: |
          helm repo add retail-store https://aws-containers.github.io/retail-store-sample-app/
          helm repo update

      - name: Lint custom values against upstream chart
        run: |
          helm template retail-store retail-store/retail-store-sample-app \
            -n ${{ env.NAMESPACE }} -f values-rds-dynamodb.yaml > /tmp/rendered.yaml
          helm lint retail-store/retail-store-sample-app -f values-rds-dynamodb.yaml

  # ============================================================
  # VALIDATE - Lambda source syntax + smoke test (PR only)
  # ============================================================
  validate-lambda:
    name: Validate Lambda
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: application/lambda/bedrock_asset_processor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check + unit-style smoke test
        run: |
          python -m py_compile handler.py
          python -c "
          from handler import handler
          result = handler({'Records':[{'s3':{'object':{'key':'test.jpg'}}}]}, None)
          assert result['statusCode'] == 200
          print('Lambda handler smoke test passed')
          "

  # ============================================================
  # DEPLOY - push/merge to main, or manual dispatch.
  # Assumes the cluster, RDS/DynamoDB, AWS Load Balancer Controller,
  # and Secrets Store CSI Driver already exist (from the
  # infrastructure layer / one-time cluster add-on setup).
  # ============================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: production # optional manual-approval gate; safe to remove
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH_METHOD != 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ vars.AWS_AUTH_METHOD == 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      # ---- Path A: raw manifests (used only if no Helm values file is committed) ----
      - name: Apply Kubernetes manifests
        if: hashFiles('application/helm/retail-store/*.yaml') == ''
        run: |
          kubectl apply -f application/kubernetes/namespace.yaml
          kubectl apply -f application/kubernetes/retail-store/
          kubectl apply -f application/kubernetes/ingress.yaml
          kubectl apply -f application/kubernetes/network-policies/

      # ---- Path B: Helm (used since values-rds-dynamodb.yaml is committed) ----
      - uses: azure/setup-helm@v4
        if: hashFiles('application/helm/retail-store/*.yaml') != ''
        with:
          version: "latest"

      - name: Deploy via Helm
        if: hashFiles('application/helm/retail-store/*.yaml') != ''
        working-directory: application/helm/retail-store
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f secretProviderClass.yaml
          helm repo add retail-store https://aws-containers.github.io/retail-store-sample-app/
          helm repo update
          helm upgrade --install retail-store retail-store/retail-store-sample-app \
            -n ${{ env.NAMESPACE }} --create-namespace \
            -f values-rds-dynamodb.yaml \
            --wait --timeout 5m

      - name: Verify rollout
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }} -o wide