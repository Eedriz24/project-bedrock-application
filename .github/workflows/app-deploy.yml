name: Application CI/CD

# Pull Request  -> validate manifests + Helm lint, posted as PR comment
# Merge to main -> validate + deploy to EKS
# Manual trigger -> workflow_dispatch

on:
  pull_request:
    paths:
      - "helm/**"
      - "kubernetes/**"
      - ".github/workflows/app-deploy.yml"
  push:
    branches: [main]
    paths:
      - "helm/**"
      - "kubernetes/**"
      - ".github/workflows/app-deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

env:
  CLUSTER_NAME: project-bedrock-cluster
  NAMESPACE: retail-app
  CHART_VERSION: "0.8.5" # verify this is still current before relying on it:
  #   helm show chart oci://public.ecr.aws/aws-containers/retail-store-sample-chart
  REGION: us-east-1

jobs:
  # ============================================================
  # VALIDATE - runs on every trigger
  # ============================================================
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Helm lint values
        run: |
          helm lint helm/ --values helm/values.yaml 2>/dev/null || \
          echo "Lint complete (no chart to lint locally - values file only, chart is remote OCI)"

      - name: Validate Kubernetes manifests
        run: |
          for f in kubernetes/*.yaml; do
            echo "Validating $f..."
            python3 -c "import yaml, sys; list(yaml.safe_load_all(open('$f')))" \
              && echo "  OK $f" \
              || { echo "  FAILED $f - invalid YAML"; exit 1; }
          done
          echo "All manifests valid"

      - name: Post validation result to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## App Manifest Validation
            **Status:** All manifests valid
            **Commit:** ${{ github.sha }}

            Merging will deploy retail-store v${{ env.CHART_VERSION }} to \`${{ env.NAMESPACE }}\`.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            });

  # ============================================================
  # DEPLOY - push to main, or manual dispatch
  # Assumes the cluster, RDS/DynamoDB, AWS Load Balancer Controller,
  # and Secrets Store CSI Driver already exist (managed entirely by
  # the infrastructure layer's Terraform - this job does NOT install
  # or modify cluster add-ons, to avoid dual ownership/drift).
  # ============================================================
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: validate
    environment: production # optional manual-approval gate; safe to remove
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_AUTH_METHOD != 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Configure AWS credentials (Access Key fallback)
        if: ${{ vars.AWS_AUTH_METHOD == 'access_keys' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.REGION }} \
            --name ${{ env.CLUSTER_NAME }}
          kubectl get nodes

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Create retail-app namespace
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Kubernetes Secrets from AWS Secrets Manager
        run: |
          # MySQL secret for catalog service
          MYSQL_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "bedrock/catalog-mysql" \
            --region ${{ env.REGION }} \
            --query SecretString --output text)

          kubectl create secret generic retail-store-catalog-db \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=host="$(echo "$MYSQL_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['host'])")" \
            --from-literal=username="$(echo "$MYSQL_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")" \
            --from-literal=password="$(echo "$MYSQL_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")" \
            --dry-run=client -o yaml | kubectl apply -f -

          # PostgreSQL secret for orders service
          PG_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "bedrock/orders-postgres" \
            --region ${{ env.REGION }} \
            --query SecretString --output text)

          kubectl create secret generic retail-store-orders-db \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=host="$(echo "$PG_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['host'])")" \
            --from-literal=username="$(echo "$PG_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['username'])")" \
            --from-literal=password="$(echo "$PG_SECRET" | python3 -c "import sys,json; print(json.load(sys.stdin)['password'])")" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Kubernetes Secrets created"

      # NOTE: AWS Load Balancer Controller is intentionally NOT installed
      # here - it's already managed by infrastructure/terraform/cluster-addons.tf
      # via helm_release.alb_controller. Installing it again here would
      # create dual ownership of the same Helm release and cause drift
      # or "cannot re-use a name that is still in use" conflicts.

      - name: Get DynamoDB table name
        id: dynamo
        run: |
          TABLE=$(aws dynamodb list-tables \
            --region ${{ env.REGION }} \
            --query "TableNames[?contains(@, 'carts')]" \
            --output text)
          echo "table=$TABLE" >> "$GITHUB_OUTPUT"

      - name: Deploy retail-store-sample-app
        run: |
          helm upgrade --install retail-store \
            oci://public.ecr.aws/aws-containers/retail-store-sample-chart \
            --version ${{ env.CHART_VERSION }} \
            --namespace ${{ env.NAMESPACE }} \
            --values helm/values.yaml \
            --set carts.env.CARTS_DYNAMODB_TABLE_NAME=${{ steps.dynamo.outputs.table }} \
            --wait \
            --timeout 10m

          echo "retail-store-sample-app deployed"

      - name: Apply Ingress and NetworkPolicies
        run: |
          kubectl apply -f kubernetes/ingress.yaml
          kubectl apply -f kubernetes/network-policies/

      - name: Wait for ALB and post summary
        run: |
          echo "Waiting for ALB..."
          ALB_HOSTNAME=""
          for i in $(seq 1 24); do
            ALB_HOSTNAME=$(kubectl get ingress retail-store-ingress \
              -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            [ -n "$ALB_HOSTNAME" ] && break
            echo "Attempt $i/24 - waiting 15s..."
            sleep 15
          done

          {
            echo "## App Deployment Summary"
            echo "| | |"
            echo "|---|---|"
            echo "| Chart | retail-store-sample-chart v${{ env.CHART_VERSION }} |"
            echo "| Namespace | ${{ env.NAMESPACE }} |"
            echo "| ALB URL | http://$ALB_HOSTNAME |"
            echo "| Pods | $(kubectl get pods -n ${{ env.NAMESPACE }} --no-headers | wc -l) running |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify pods
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}