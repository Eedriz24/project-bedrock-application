# Custom values overriding the upstream retail-store-sample-app chart
# to use managed AWS data services instead of in-cluster databases.

catalog:
  mysql:
    enabled: false   # disable in-cluster MySQL
  env:
    RETAIL_CATALOG_PERSISTENCE_PROVIDER: mysql
  # DB host/user/password sourced from AWS Secrets Manager via the
  # Secrets Store CSI Driver - see secretProviderClass.yaml
  secretProviderClass: catalog-mysql-spc

orders:
  postgresql:
    enabled: false   # disable in-cluster PostgreSQL
  env:
    RETAIL_ORDERS_PERSISTENCE_PROVIDER: postgres
  secretProviderClass: orders-postgres-spc

carts:
  dynamodb:
    enabled: true
    tableName: bedrock-carts
  env:
    RETAIL_CARTS_PERSISTENCE_PROVIDER: dynamodb
    AWS_REGION: us-east-1
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::232428703462:role/bedrock-carts-irsa"

# Message brokers stay in-cluster 
rabbitmq:
  enabled: true
redis:
  enabled: true

ui:
  ingress:
    enabled: true
    className: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
